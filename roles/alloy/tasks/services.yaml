---

- name: Services > Services
  ansible.builtin.service:
    name: "{{ item }}"
    state: |-
      {{
        'restarted'
          if (
            __manala_alloy_config_template_result | default({}) is changed
            or __manala_alloy_environment_result | default({}) is changed
          ) else
        'started'
      }}
    enabled: true
  loop:
    - alloy

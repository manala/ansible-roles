---

###########
# Default #
###########

- name: Default
  tags: [default]
  hosts: debian
  tasks:
    - block:  # noqa: name[missing]
        - name: Role
          ansible.builtin.import_role:
            name: manala.roles.alloy
      always:
        - name: Goss
          ansible.builtin.command:
            cmd: goss --gossfile - validate --retry-timeout 10s
            stdin: "{{ lookup('ansible.builtin.template', 'goss/default.yaml.j2') }}"
          changed_when: false

###############
# Environment #
###############

- name: Environment
  tags: [environment]
  hosts: debian
  vars:
    tests_dir: /molecule/alloy/environment
  tasks:
    - name: Clean tests dir  # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ tests_dir }}"
        state: "{{ item }}"
      loop: [absent, directory]
    - name: Prepare test file
      ansible.builtin.copy:
        dest: "{{ tests_dir }}/custom_args"
        mode: "0644"
        content: |
          CONFIG_FILE="/etc/alloy/config.alloy"
          CUSTOM_ARGS=""
          RESTART_ON_UPGRADE=true
    - block:  # noqa: name[missing]
        - name: Role - CUSTOM_ARGS
          ansible.builtin.import_role:
            name: manala.roles.alloy
            tasks_from: environment
          vars:
            manala_alloy_environment_file: "{{ tests_dir }}/custom_args"
            manala_alloy_environment:
              CUSTOM_ARGS: --disable-reporting
      always:
        - name: Goss
          ansible.builtin.command:
            cmd: goss --gossfile - validate
            stdin: "{{ lookup('ansible.builtin.template', 'goss/environment.yaml.j2') }}"
          changed_when: false

##########
# Config #
##########

- name: Config
  tags: [config]
  hosts: debian
  vars:
    tests_dir: /molecule/alloy/config
  tasks:
    - name: Clean tests dir  # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ tests_dir }}"
        state: "{{ item }}"
      loop: [absent, directory]
    - block:  # noqa: name[missing]
        - name: Role - Content
          ansible.builtin.import_role:
            name: manala.roles.alloy
            tasks_from: config
          vars:
            manala_alloy_config_file: "{{ tests_dir }}/content"
            manala_alloy_config_template: ~
            manala_alloy_config: |
              Content
        - name: Role - Template
          ansible.builtin.import_role:
            name: manala.roles.alloy
            tasks_from: config
          vars:
            manala_alloy_config_file: "{{ tests_dir }}/template"
            manala_alloy_config_template: fixtures/template.j2
            manala_alloy_config: ~
      always:
        - name: Goss
          ansible.builtin.command:
            cmd: goss --gossfile - validate
            stdin: "{{ lookup('ansible.builtin.template', 'goss/config.yaml.j2') }}"
          changed_when: false
